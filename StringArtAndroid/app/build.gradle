plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stringart.generator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stringart.generator'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
}
